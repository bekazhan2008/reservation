spring.application.name=reservation

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:15432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cookie сессии: недоступна из JavaScript и не отправляется с запросами с чужих сайтов (кроме переходов по ссылке).
# Secure не включаем принудительно: локально backend работает по HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Hibernate по умолчанию пишет в WARN текст ошибки PostgreSQL (включая значения ключей, например email).
# Исключение при этом не теряется: его обрабатывает приложение.
logging.level.org.hibernate.orm.jdbc.error=ERROR
